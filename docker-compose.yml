services:
  db:
    image: postgres:16-alpine
    container_name: jartest_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eta_password_secure}
      POSTGRES_DB: ${POSTGRES_DB:-eta_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - jartest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eta_user} -d ${POSTGRES_DB:-eta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jartest_fastapi_app
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-eta_user}:${POSTGRES_PASSWORD:-eta_password_secure}@${POSTGRES_HOST:-db}:5432/${POSTGRES_DB:-eta_db}}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY nao definido no .env}
      CPF_KEY: ${CPF_KEY:-}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8002}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER nao definido no .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD nao definido no .env}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USER}}
      SMTP_TLS: ${SMTP_TLS:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL nao definido no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD nao definido no .env}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      # ── Mercado Pago / Planos pagos ──
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_API_BASE: ${MERCADOPAGO_API_BASE:-https://api.mercadopago.com}
      PLANO_MENSAL_PRECO: ${PLANO_MENSAL_PRECO:-4.99}
      PLANO_TRIMESTRAL_PRECO: ${PLANO_TRIMESTRAL_PRECO:-14.99}
      PLANO_ANUAL_PRECO: ${PLANO_ANUAL_PRECO:-49.99}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      # Contrato exibido em GET /api/v1/auth/contrato (fonte única na raiz do repo)
      - ./Contrato_saas.txt:/app/Contrato_saas.txt:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: jartest_react_app
    restart: always
    ports:
      - "${FRONTEND_PORT:-8002}:80"
    depends_on:
      - backend

volumes:
  jartest_postgres_data:
